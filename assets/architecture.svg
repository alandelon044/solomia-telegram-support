<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
<rect width="1200" height="590" rx="20" fill="#0f172a"/>
<style>text{font-family:Arial,sans-serif;fill:#e2e8f0}.label{font-size:20px;font-weight:700}.sub{font-size:15px;fill:#a8bad2}.tag{font-size:13px;fill:#67e8f9}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs>
<text x="44" y="53" font-size="28" font-weight="700">SOLOMIA · Telegram AI Support</text>
<text x="44" y="82" class="sub">AI drafts the reply. A staff member decides what reaches the customer.</text>
<rect x="44" y="130" width="230" height="110" rx="12" fill="#18334b" stroke="#38bdf8"/>
<text x="64" y="166" class="label">1 · Telegram intake</text><text x="64" y="194" class="sub">Customer text message</text><text x="64" y="219" class="tag">Messages / button callbacks</text>
<rect x="330" y="130" width="230" height="110" rx="12" fill="#24334b" stroke="#818cf8"/>
<text x="350" y="166" class="label">2 · Gemini triage</text><text x="350" y="194" class="sub">Category · priority · summary</text><text x="350" y="219" class="tag">Structured reply draft</text>
<rect x="616" y="130" width="230" height="110" rx="12" fill="#24334b" stroke="#fbbf24"/>
<text x="636" y="166" class="label">3 · Ticket record</text><text x="636" y="194" class="sub">n8n Data Table</text><text x="636" y="219" class="tag">Initial status: pending</text>
<rect x="902" y="130" width="254" height="110" rx="12" fill="#24334b" stroke="#34d399"/>
<text x="922" y="166" class="label">4 · Staff review</text><text x="922" y="194" class="sub">Sender-ID + status checks</text><text x="922" y="219" class="tag">Send draft / take over</text>
<path d="M274 184H328M560 184H614M846 184H900" class="line"/>
<rect x="902" y="298" width="254" height="100" rx="12" fill="#133d35" stroke="#34d399"/>
<text x="922" y="334" class="label">5 · Customer message</text><text x="922" y="363" class="sub">Then update: sent / human</text><path d="M1030 240V296" class="line"/>
<rect x="330" y="298" width="516" height="100" rx="12" fill="#3c2e25" stroke="#fb923c"/>
<text x="350" y="334" class="label">Handled AI failure → fallback review ticket</text><text x="350" y="363" class="sub">Preserve the request; ask a human to review.</text><path d="M445 240V296" class="line"/>
<rect x="44" y="450" width="1112" height="94" rx="12" fill="#342439" stroke="#f472b6"/>
<text x="64" y="485" class="label">Fatal execution failure → Error Trigger → Telegram alert to owner</text><text x="64" y="516" class="sub">Workflow name + failed step + execution link. No customer message or raw error stack in the alert.</text>
</svg>
